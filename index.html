<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1C1816">
<meta name="description" content="سمرة: لعبة جمعات سعودية. مسيرة واسمعها ومن فينا؟">
<title>سمرة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/symbol.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sadu" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>

<dialog id="scores" aria-labelledby="scores-title">
  <h2 id="scores-title">النقاط</h2>
  <p class="muted small">لو انضغط زر غلط، عدّل النقاط من هنا.</p>
  <ul id="scores-list" class="adjust"></ul>
  <button class="btn" type="button" data-close>تم</button>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">تنهي السهرة؟</h2>
  <p class="muted">النقاط بتنمسح وما تقدر ترجع لها.</p>
  <div class="row">
    <button class="btn danger" type="button" id="confirm-yes">إيه، أنهها</button>
    <button class="btn ghost" type="button" data-close>لا، كمّل</button>
  </div>
</dialog>

<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
